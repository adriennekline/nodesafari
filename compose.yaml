services:
  nodesafari:
    build:
      context: .
    image: nodesafari:latest
    ports:
      - "8501:8501"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
