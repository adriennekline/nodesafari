[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nodesafari"
version = "1.1.0"
description = "Interpretable biological network discovery, comparison, perturbation, and graph ML."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Adrienne Kline"},
]
keywords = ["network-science", "bioinformatics", "graph-neural-networks", "graph-machine-learning", "streamlit", "rich-club"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "altair>=5.4,<7",
  "matplotlib>=3.8,<4",
  "networkx>=3.3,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.urls]
Homepage = "https://github.com/adriennekline/nodesafari"
Issues = "https://github.com/adriennekline/nodesafari/issues"

[tool.setuptools.packages.find]
include = ["nodesafari*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
