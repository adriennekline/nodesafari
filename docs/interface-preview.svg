<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">NodeSafari interface preview</title>
  <desc id="desc">Dark scientific dashboard with data controls, network metrics, analysis tabs, a gene interaction network, and a ranked node table.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06101c"/><stop offset=".58" stop-color="#0b1b2a"/><stop offset="1" stop-color="#102d3d"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1440" height="860" rx="24" fill="url(#bg)"/>
