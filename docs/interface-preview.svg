  <text x="30" y="141" font-family="Inter,Arial,sans-serif" font-size="13" fill="#8fa6b7">Upload an edge list or use the demo.</text>
  <text x="30" y="184" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#afc1cf">PRIMARY NETWORK</text>
