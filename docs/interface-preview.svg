<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">NodeSafari Getting Started interface</title>
  <desc id="desc">A clean white network-discovery workspace with six top-level application tabs and a question-led Analysis Navigator in Getting Started.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".72" stop-color="#fbfaff"/><stop offset="1" stop-color="#f0fdfa"/></linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#0f9f91"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#372364" flood-opacity=".07"/></filter>
  </defs>
  <rect width="1440" height="860" rx="24" fill="url(#bg)"/>
  <rect width="286" height="860" rx="24" fill="#faf9ff"/>
  <path d="M286 0v860" stroke="#e5def5"/>

  <rect x="28" y="28" width="38" height="38" rx="12" fill="url(#mark)"/>
  <path d="M37 50c7-18 14 16 22-3M38 41c7 17 14-16 21 1" fill="none" stroke="#ccfbf1" stroke-width="2.5" stroke-linecap="round"/>
  <text x="78" y="48" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="750" fill="#201a3b">NodeSafari</text>
  <text x="78" y="64" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1" fill="#807a91">RESEARCH WORKSPACE · V1.5.0</text>

  <text x="28" y="112" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#30294e">Data workspace</text>
  <text x="28" y="135" font-family="Inter,Arial,sans-serif" font-size="12" fill="#716b84">Upload a network or use the demo.</text>
  <text x="28" y="174" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="650" fill="#625d76">Network A · reference</text>
  <rect x="28" y="188" width="230" height="62" rx="10" fill="#ffffff" stroke="#cfc5e8" stroke-dasharray="5 4"/>
  <path d="M134 207v20m-8-12 8-8 8 8" fill="none" stroke="#0f9f91" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="89" y="239" font-family="Inter,Arial,sans-serif" font-size="11" fill="#68637d">Drop CSV or browse</text>
  <text x="28" y="284" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="650" fill="#625d76">Network B · optional comparison</text>
  <rect x="28" y="298" width="230" height="62" rx="10" fill="#ffffff" stroke="#cfc5e8" stroke-dasharray="5 4"/>
  <path d="M134 317v20m-8-12 8-8 8 8" fill="none" stroke="#0f9f91" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="89" y="349" font-family="Inter,Arial,sans-serif" font-size="11" fill="#68637d">Drop CSV or browse</text>

  <rect x="28" y="386" width="230" height="112" rx="11" fill="#ffffff" stroke="#e4deef"/>
  <text x="43" y="408" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="750" letter-spacing="1" fill="#847d95">ACTIVE DATA</text>
  <text x="43" y="437" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="800" fill="#0f9f91">A</text><text x="64" y="437" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="650" fill="#30294e">Synthetic reference example</text>
  <text x="64" y="453" font-family="Inter,Arial,sans-serif" font-size="10" fill="#817a91">Demo data</text>
  <path d="M43 465h199" stroke="#eeeaf5"/>
  <text x="43" y="486" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="800" fill="#0f9f91">B</text><text x="64" y="486" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="650" fill="#30294e">Synthetic comparison</text>

  <g font-family="Inter,Arial,sans-serif" font-size="12" font-weight="650" fill="#30294e">
    <rect x="28" y="522" width="230" height="42" rx="10" fill="#ffffff" stroke="#e4deef"/><text x="43" y="548">Network settings</text><path d="M235 538l6 6 6-6" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="28" y="574" width="230" height="42" rx="10" fill="#ffffff" stroke="#e4deef"/><text x="43" y="600">Rich-club settings</text><path d="M235 590l6 6 6-6" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="28" y="626" width="230" height="42" rx="10" fill="#ffffff" stroke="#e4deef"/><text x="43" y="652">Perturbation settings</text><path d="M235 642l6 6 6-6" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>

  <rect x="310" y="20" width="1098" height="108" rx="17" fill="#ffffff" stroke="#e7e2f1" filter="url(#shadow)"/>
  <text x="336" y="47" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.8" fill="#0f9f91">NODESAFARI · INTERPRETABLE NETWORK DISCOVERY</text>
  <text x="336" y="79" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="750" fill="#201a3b">Turn connected data into testable questions.</text>
  <text x="336" y="105" font-family="Inter,Arial,sans-serif" font-size="13" fill="#625d76">Choose an application to validate, explore, compare, perturb, or predict.</text>

  <text x="316" y="157" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="750" letter-spacing="1.5" fill="#827b93">APPLICATIONS</text>
  <g font-family="Inter,Arial,sans-serif" font-size="12" font-weight="650">
    <rect x="310" y="168" width="150" height="42" rx="10" fill="#ede9fe" stroke="#c4b5fd"/><text x="329" y="194" fill="#5b21b6">Getting Started</text>
    <text x="486" y="194" fill="#625d76">Data &amp; QC</text>
    <text x="596" y="194" fill="#625d76">Explore</text>
    <text x="688" y="194" fill="#625d76">Compare</text>
    <text x="787" y="194" fill="#625d76">Perturb</text>
    <text x="878" y="194" fill="#625d76">Predict</text>
  </g>
  <path d="M310 217h1098" stroke="#e9e4f1"/>

  <text x="316" y="252" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="750" letter-spacing="1.4" fill="#0f9f91">EXPLORE</text>
  <text x="316" y="281" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="740" fill="#261f42">Start with your question</text>
  <text x="316" y="306" font-family="Inter,Arial,sans-serif" font-size="13" fill="#716b84">The Analysis Navigator turns your goal and available data into a clear route.</text>

  <g font-family="Inter,Arial,sans-serif">
    <rect x="316" y="330" width="336" height="76" rx="12" fill="#ffffff" stroke="#e4deef"/><circle cx="341" cy="354" r="11" fill="#ede9fe"/><text x="338" y="358" font-size="11" font-weight="750" fill="#6d28d9">1</text><text x="360" y="358" font-size="13" font-weight="700" fill="#30294e">Choose data</text><text x="334" y="385" font-size="11" fill="#716b84">Use the demo or upload network A.</text>
    <rect x="666" y="330" width="336" height="76" rx="12" fill="#ffffff" stroke="#e4deef"/><circle cx="691" cy="354" r="11" fill="#ede9fe"/><text x="688" y="358" font-size="11" font-weight="750" fill="#6d28d9">2</text><text x="710" y="358" font-size="13" font-weight="700" fill="#30294e">Choose a question</text><text x="684" y="385" font-size="11" fill="#716b84">No algorithm name is required.</text>
    <rect x="1016" y="330" width="336" height="76" rx="12" fill="#ffffff" stroke="#e4deef"/><circle cx="1041" cy="354" r="11" fill="#ede9fe"/><text x="1038" y="358" font-size="11" font-weight="750" fill="#6d28d9">3</text><text x="1060" y="358" font-size="13" font-weight="700" fill="#30294e">Open the route</text><text x="1034" y="385" font-size="11" fill="#716b84">Follow the recommended application.</text>
  </g>

  <text x="316" y="447" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="650" fill="#625d76">What do you want to learn?</text>
  <rect x="316" y="460" width="620" height="44" rx="9" fill="#ffffff" stroke="#cfc5e8"/><text x="334" y="487" font-family="Inter,Arial,sans-serif" font-size="13" fill="#30294e">What organizes this network?</text><path d="M906 477l6 6 6-6" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="960" y="447" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="650" fill="#625d76">What data do you have?</text>
  <rect x="960" y="460" width="392" height="44" rx="9" fill="#ffffff" stroke="#cfc5e8"/><text x="978" y="487" font-family="Inter,Arial,sans-serif" font-size="13" fill="#30294e">One network</text><path d="M1322 477l6 6 6-6" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>

  <rect x="316" y="530" width="1036" height="224" rx="15" fill="#ffffff" stroke="#ddd6ee" filter="url(#shadow)"/>
  <rect x="338" y="552" width="36" height="36" rx="10" fill="url(#mark)"/><path d="M347 573c7-18 14 16 20-3" fill="none" stroke="#ccfbf1" stroke-width="2" stroke-linecap="round"/>
  <text x="392" y="567" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="740" fill="#261f42">Map network structure</text>
  <text x="392" y="588" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#0f766e">Primary method · Community detection</text>
  <text x="338" y="629" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="750" letter-spacing="1.1" fill="#827b93">WHY THIS FITS</text>
  <text x="338" y="650" font-family="Inter,Arial,sans-serif" font-size="12" fill="#625d76">Find modules and central connectors without assuming labels.</text>
  <text x="785" y="629" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="750" letter-spacing="1.1" fill="#827b93">SUPPORTING METHODS</text>
  <text x="785" y="650" font-family="Inter,Arial,sans-serif" font-size="12" fill="#625d76">Hubs, k-core structure, bridges, and statistics</text>
  <rect x="338" y="681" width="992" height="43" rx="9" fill="#f2efff" stroke="#ddd6fe"/>
  <text x="357" y="707" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="680" fill="#5b21b6">Recommended route · Explore → Overview &amp; hubs, Communities, Core &amp; bridges</text>
  <text x="316" y="797" font-family="Inter,Arial,sans-serif" font-size="11" fill="#827b93">Active-data summary appears below the recommendation; analysis results stay inside their application tabs.</text>
</svg>
