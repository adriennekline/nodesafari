  <text x="326" y="92" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750" fill="#edf6f8">NodeSafari</text>
  <text x="326" y="121" font-family="Inter,Arial,sans-serif" font-size="15" fill="#afc1cf">Discover modules, compare conditions, simulate perturbations, and learn graph representations.</text>
